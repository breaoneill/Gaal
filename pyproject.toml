[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaal"
version = "0.1.0"
description = "Standalone deterministic communications briefings"
requires-python = ">=3.11"

[project.scripts]
gaal = "gaal.cli:main"

[project.optional-dependencies]
microsoft365 = ["msal>=1.31,<2"]

[tool.setuptools.packages.find]
where = ["src"]
